[workspace]
name = "ecoscope-dev"
channels = [
    "https://repo.prefix.dev/ecoscope-workflows/",
    "https://repo.prefix.dev/ecoscope-workflows-custom/",
    "conda-forge",
]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.10"

# Geospatial / scientific stack
[feature.geospatial.dependencies]
rasterio = "*"
geopandas = "*"
statsmodels = "*"
pandas = "<3"
numpy = ">=2,<2.1"
plotly = "*"
scikit-learn = "*"
scikit-image = "*"
earthengine-api = ">=1.4,<1.7.13"
python-igraph = "*"
astropy = "*"
pydeck = { version = "==0.0.2", channel = "https://repo.prefix.dev/ecoscope-workflows-custom" }
# Constrained by ecoscope-earthranger-io-core (pulled in via ecoscope[platform]),
# which requires pyarrow >=20,<24.
pyarrow = ">=20,<24"

# Workflow compile / runtime deps
[feature.workflow.dependencies]
py-rattler = ">=0.15.0,<0.16"
datamodel-code-generator = ">=0.26.3"
cloudpathlib-gs = "*"
lithops = { version = "==3.6.0", channel = "https://repo.prefix.dev/ecoscope-workflows" }
obstore = ">=0.6.0,<0.7"
pydot = ">=4.0.0"
graphviz = "*"
opentelemetry-sdk = ">=1.37.0,<2"
opentelemetry-exporter-gcp-trace = ">=1.9.0,<2"
jinja2 = "*"
pandera = ">=0.24.0,<0.29"
pydantic = "<2.9.0"
pydantic-settings = "*"
"ruamel.yaml" = "*"
tomli-w = "*"
yq = "*"
setuptools = "<81"

# Dev tools (lint, type-check, test, browser automation)
[feature.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-check = "*"
syrupy = "*"
pillow = "*"
pandas-stubs = "*"
pandera-mypy = "*"

[feature.dev.pypi-dependencies]
playwright = ">=1.45.0,<1.48"
pytest-playwright = "*"
types-shapely = "*"
types-click = "*"
python-docx = "*"
docxtpl = "*"
docxcompose = "*"
pandasql = "*"

# Documentation site
[feature.docs.dependencies]
mkdocs-material = "*"
watchdog = ">=6.0.0,<7"

[feature.docs.pypi-dependencies]
mkdocs-awesome-pages-plugin = "*"

# Conda package build / publish tooling
[feature.build.dependencies]
curl = "*"
rattler-build = "*"
yq = "*"
hatch = "*"
hatch-vcs = "*"


# todo: update this section based on your local development needs. This is meant to be used for editable installs of ecoscope and related packages, so that you can make code changes locally and have them reflected in your environment without needing to reinstall.
# [feature.editables.pypi-dependencies]
# ecoscope = { path = "<your_path_to_ecoscope>", editable = true, extras = [
#     "plotting",
#     "analysis",
#     "mapping",
#     "platform",
# ] }
# ecoscope-workflows-ext-custom = { path = "<your_path_to_task_library>/src/ecoscope-workflows-ext-custom", editable = true }
# ecoscope-workflows-ext-mt = { path = "<your_custom_task_lib>/src/ecoscope-workflows-ext-mt", editable = true }

[environments]
default = { features = ["geospatial", "workflow", "dev", "editables"] }
docs = { features = ["geospatial", "workflow", "editables", "docs"] }
build = { features = ["build"], no-default-feature = true }
