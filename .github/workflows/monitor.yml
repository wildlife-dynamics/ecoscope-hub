name: Workflow monitor

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "monitor/**"
      - ".github/workflows/monitor.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workflow-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MONITOR_PAT: ${{ secrets.MONITOR_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          pixi-version: v0.57.0
          manifest-path: monitor/pixi.toml
      - name: Test
        run: pixi run pytest -q tests --ignore=tests/test_live.py
      - name: Discover unregistered workflow repos
        run: pixi run python discover.py --json > "$GITHUB_WORKSPACE/unregistered.json"
      - name: Collect snapshot
        run: pixi run python collect.py --unregistered "$GITHUB_WORKSPACE/unregistered.json"
      - name: Assemble site
        run: cp index.html build/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: monitor/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
